<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Photo Grid">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Photo Grid</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-512.png">
  <link rel="stylesheet" href="css/app.css">
  <style id="page-style">@page { size: A4 portrait; margin: 0; }</style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="btn-new" class="icon-btn" type="button" aria-label="Start over" title="Start over">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>
      </button>
      <div id="mode" class="segmented mode-switch" role="group" aria-label="Mode">
        <button type="button" data-mode="collage">Collage</button>
        <button type="button" data-mode="batch">Batch</button>
      </div>
      <button id="btn-add" class="btn btn-small" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Add
      </button>
    </header>

    <main id="stage">
      <canvas id="preview" aria-label="Page preview"></canvas>
    </main>

    <div id="pager" class="pager" hidden>
      <button id="btn-prev" class="icon-btn" type="button" aria-label="Previous page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span id="pager-label">Page 1 of 1</span>
      <button id="btn-next" class="icon-btn" type="button" aria-label="Next page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <section id="controls" class="controls">
      <!-- Default panel: layout and page settings -->
      <div id="panel-main">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-tab="layout" aria-selected="true">Layout</button>
          <button type="button" role="tab" data-tab="page" aria-selected="false">Page</button>
        </div>

        <div class="tab-body" data-tab-body="layout">
          <div id="layout-strip" class="strip"></div>
        </div>

        <div class="tab-body" data-tab-body="page" hidden>
          <div class="row">
            <div class="segmented" data-setting="paper">
              <button type="button" data-value="A4">A4</button>
              <button type="button" data-value="Letter">Letter</button>
            </div>
            <div class="segmented" data-setting="orientation">
              <button type="button" data-value="portrait">Portrait</button>
              <button type="button" data-value="landscape">Landscape</button>
            </div>
          </div>
          <label class="slider">
            <span>Gap</span>
            <input type="range" min="0" max="20" step="1" data-setting="gapMm">
            <output data-for="gapMm"></output>
          </label>
          <label class="slider">
            <span>Margin</span>
            <input type="range" min="0" max="30" step="1" data-setting="marginMm">
            <output data-for="marginMm"></output>
          </label>
          <label class="slider">
            <span>Corners</span>
            <input type="range" min="0" max="15" step="1" data-setting="radiusMm">
            <output data-for="radiusMm"></output>
          </label>
          <div class="swatches" role="radiogroup" aria-label="Background">
            <span class="swatch-label">Background</span>
            <button type="button" data-bg="#ffffff" style="--c:#ffffff" aria-label="White"></button>
            <button type="button" data-bg="#f7f2e8" style="--c:#f7f2e8" aria-label="Cream"></button>
            <button type="button" data-bg="#e9e9ec" style="--c:#e9e9ec" aria-label="Light grey"></button>
            <button type="button" data-bg="#f6e1e1" style="--c:#f6e1e1" aria-label="Blush"></button>
            <button type="button" data-bg="#e1ebe2" style="--c:#e1ebe2" aria-label="Sage"></button>
            <button type="button" data-bg="#111111" style="--c:#111111" aria-label="Black"></button>
          </div>
        </div>

        <button id="btn-output" class="btn btn-primary btn-block" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6M7 18H4v-7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v7h-3M7 14h10v7H7z"/></svg>
          Print or save
        </button>
      </div>

      <!-- Photo panel: shown while a photo is selected -->
      <div id="panel-photo" hidden>
        <p id="photo-hint" class="hint">Drag to move · pinch or slide to zoom</p>
        <label class="slider">
          <span>Zoom</span>
          <input id="zoom" type="range" min="1" max="4" step="0.01">
          <output id="zoom-out"></output>
        </label>
        <div class="tools">
          <button id="btn-rotate" type="button" class="tool">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4h-4"/></svg>
            Rotate
          </button>
          <button id="btn-fit" type="button" class="tool">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="7" y="8" width="10" height="8" rx="1"/></svg>
            <span id="fit-label">Fit</span>
          </button>
          <button id="btn-swap" type="button" class="tool">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>
            Swap
          </button>
          <button id="btn-replace" type="button" class="tool">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg>
            Replace
          </button>
          <button id="btn-remove" type="button" class="tool tool-danger">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
            Remove
          </button>
        </div>
        <button id="btn-done" class="btn btn-block" type="button">Done</button>
      </div>
    </section>
  </div>

  <!-- Modal sheet (output, confirmations, progress) -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <h2 id="sheet-title"></h2>
      <p id="sheet-text"></p>
      <div id="sheet-actions" class="sheet-actions"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <input id="file-add" class="file-input" type="file" accept="image/*" multiple>
  <input id="file-replace" class="file-input" type="file" accept="image/*">

  <div id="print-root" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
